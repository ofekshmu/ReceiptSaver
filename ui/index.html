<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Saver</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">Receipt&nbsp;Saver<span id="app-version" class="version" title="App version"></span></div>
    <nav class="tabs">
      <button data-view="run" class="tab active">This run</button>
      <button data-view="history" class="tab">History</button>
      <button data-view="fallbacks" class="tab">Fallbacks <span id="fb-badge" class="badge" hidden>0</span></button>
      <button data-view="receipts" class="tab">Receipts</button>
      <button data-view="rules" class="tab">Rules</button>
    </nav>
    <div class="win-controls">
      <button id="btn-rescan" title="Run scan now">&#10227;</button>
      <button id="btn-min" title="Minimize">&#8211;</button>
      <button id="btn-close" title="Close to tray">&times;</button>
    </div>
  </header>

  <main>
    <section id="view-run" class="view active">
      <div id="run-prompt" class="run-prompt" hidden>
        <p>No scan has run yet this session.</p>
        <button id="run-start">Run scan</button>
      </div>
      <div id="run-summary" class="summary"></div>
      <div id="run-accounts"></div>
      <div id="run-list" class="cards"></div>
      <div id="run-empty" class="empty" hidden>Nothing new this run.</div>
    </section>

    <section id="view-history" class="view">
      <div class="filters">
        <input id="hist-search" type="search" placeholder="Search sender, subject, seller&hellip;" dir="auto">
      </div>
      <div id="hist-list" class="cards"></div>
      <div id="hist-sentinel"></div>
    </section>

    <section id="view-fallbacks" class="view">
      <div class="fb-toolbar">
        <button id="fb-viewtoggle">Simple view</button>
        <button id="fb-handoff" disabled title="Handle selected with Claude">
          <svg class="claude-mark" viewBox="0 0 24 24" aria-hidden="true" width="14" height="14">
            <path fill="currentColor" d="M12 1.5l1.9 5.1 5.1 1.9-5.1 1.9L12 15.5l-1.9-5.1L5 8.5l5.1-1.9z
              M18.5 14l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z
              M5 15l.8 2 2 .8-2 .8L5 21.5l-.8-2-2-.8 2-.8z"/>
          </svg>
          <span aria-hidden="true">&rarr;</span>
        </button>
      </div>
      <div id="fb-list" class="cards"></div>
      <div id="fb-empty" class="empty" hidden>No unresolved fallbacks. &#127881;</div>
    </section>

    <section id="view-receipts" class="view">
      <div class="rx-nav"></div>
      <div class="rx-main">
        <input id="rx-search" type="search" placeholder="Search all receipts…" dir="auto">
        <div class="rx-crumbs">
          <button id="rx-back" title="Back (Alt+←)" disabled>‹</button>
          <div class="rx-crumb-trail"></div>
          <div class="rx-sort" title="Sort this folder">
            <button id="rx-sort-field">Date</button>
            <button id="rx-sort-dir" title="Descending">↓</button>
          </div>
          <button id="rx-open" title="Open this folder in Windows Explorer">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
            </svg>
          </button>
        </div>
        <div class="rx-list"></div>
        <div class="rx-empty" hidden></div>
      </div>
    </section>

    <section id="view-rules" class="view">
      <div class="cat-bar rules-bar">
        <input id="rules-search" type="search" dir="auto" placeholder="Search rules, roots, senders…">
        <button id="root-new-btn" type="button">＋ New root</button>
      </div>
      <div id="root-new-form" class="root-editor-host" hidden></div>
      <div id="rules-list"></div>
      <div id="rules-empty" class="rx-empty" hidden>No rules yet — they're created when you file fallbacks.</div>
    </section>
  </main>

  <template id="tpl-root-group">
    <section class="root-group">
      <header class="root-head">
        <span class="root-swatch"></span>
        <span class="root-name" dir="auto"></span>
        <span class="root-folder" dir="auto"></span>
        <span class="root-count"></span>
        <span class="root-actions">
          <button type="button" class="root-add-rule" title="Add a rule that files into this root">＋ New rule</button>
          <button type="button" class="root-edit-btn" title="Rename, change folder or colour">Edit</button>
          <button type="button" class="root-del" title="Delete this root">✕</button>
        </span>
      </header>
      <div class="root-editor-host" hidden></div>
      <div class="root-new-rule" hidden>
        <input class="rn-name" dir="auto" placeholder="New rule name (e.g. the seller)">
        <button type="button" class="rn-add">Add rule</button>
      </div>
      <div class="root-rules"></div>
    </section>
  </template>

  <template id="tpl-root-editor">
    <div class="root-editor">
      <div class="re-row"><label>Name</label><input class="re-name" dir="auto" placeholder="e.g. חשמל"></div>
      <div class="re-row"><label>Folder</label>
        <div class="combo re-folder" data-value="">
          <input class="combo-input" type="text" dir="auto" autocomplete="off" spellcheck="false"
                 placeholder="Pick a folder or type to search&hellip;">
          <ul class="combo-list" hidden></ul>
        </div>
      </div>
      <div class="re-row"><label>Colour</label><div class="re-colors"></div></div>
      <div class="re-actions">
        <button type="button" class="re-save">Save</button>
        <button type="button" class="re-cancel">Cancel</button>
      </div>
    </div>
  </template>

  <template id="tpl-rule">
    <article class="cat" data-id="">
      <div class="cat-row">
        <button class="cat-expand" title="Edit this rule">▸</button>
        <input class="cat-name" dir="auto" title="Rule name">
        <span class="cat-summary" dir="ltr"></span>
        <select class="rule-root" title="Move this rule to another root"></select>
        <select class="cat-merge" title="Merge this rule into another rule of the same root"></select>
        <button class="cat-save" title="Save changes">Save</button>
        <button class="cat-del" title="Delete rule">✕</button>
      </div>
      <div class="cat-editor" hidden>
        <div class="cat-fields">
          <div class="field fd-seller"><label>Seller</label><div class="nf-slot"></div></div>
          <div class="field fd-product"><label>Product</label><div class="nf-slot"></div></div>
        </div>
        <div class="field">
          <label>Match alternatives <span class="hint">(a mail matches if any alternative matches; an alternative needs all its conditions)</span></label>
          <div class="cat-matches"></div>
          <div class="cat-add-match">
            <div class="mr-slot"></div>
            <button type="button" class="cat-add-match-btn">Add alternative</button>
          </div>
        </div>
      </div>
    </article>
  </template>

  <!-- Match rule: pill lists per condition + attachments + keyword chips (makeMatchRule) -->
  <template id="tpl-matchrule">
    <div class="mr">
      <div class="mr-row" data-key="sender_contains">
        <span class="mr-lbl">Sender contains</span>
        <div class="mr-pills"></div>
        <input class="mr-add" dir="auto" placeholder="type + Enter" title="Text in the sender address, e.g. the domain">
      </div>
      <div class="mr-row" data-key="subject_contains">
        <span class="mr-lbl">Subject contains</span>
        <div class="mr-pills"></div>
        <input class="mr-add" dir="auto" placeholder="type + Enter">
      </div>
      <div class="mr-row" data-key="exclude_subject_contains">
        <span class="mr-lbl">Subject must NOT contain</span>
        <div class="mr-pills"></div>
        <input class="mr-add" dir="auto" placeholder="type + Enter">
      </div>
      <div class="mr-row" data-key="body_contains">
        <span class="mr-lbl">Body contains</span>
        <div class="mr-pills"></div>
        <input class="mr-add" dir="auto" placeholder="type + Enter">
      </div>
      <div class="mr-row" data-key="exclude_body_contains">
        <span class="mr-lbl">Body must NOT contain</span>
        <div class="mr-pills"></div>
        <input class="mr-add" dir="auto" placeholder="type + Enter">
      </div>
      <div class="mr-row mr-att-row">
        <span class="mr-lbl">Attachments</span>
        <select class="mr-attachments" title="Documents attached (images such as logos don't count)">
          <option value="">Any</option>
          <option value="none">None</option>
          <option value="one">Exactly 1</option>
          <option value="many">More than 1</option>
        </select>
        <span class="mr-att-hint"></span>
      </div>
      <div class="mr-suggest" hidden>
        <div class="mr-sg" data-group="sender"><span class="mr-sg-lbl">Sender</span><div class="mr-chips"></div></div>
        <div class="mr-sg" data-group="subject"><span class="mr-sg-lbl">Subject</span><div class="mr-chips"></div></div>
        <div class="mr-sg" data-group="body"><span class="mr-sg-lbl">Body</span><div class="mr-chips"></div></div>
      </div>
    </div>
  </template>

  <!-- Seller / Product field: a value, "use for every mail", or an extraction rule -->
  <template id="tpl-namefield">
    <div class="nf">
      <div class="nf-row">
        <input class="nf-value" dir="auto">
        <label class="nf-every" title="Ticked: every future mail matched by this rule gets this name. Unticked: only this mail — future mails get the app's suggestion.">
          <input type="checkbox" class="nf-every-cb" checked> Use for every mail
        </label>
        <button type="button" class="nf-x-toggle"
                title="Pull this name out of each email with a rule (regex) instead of a fixed value">&#9881; Extract</button>
      </div>
      <div class="nf-extract" hidden>
        <select class="nf-source" title="Which part of the email the rule reads">
          <option value="subject">Subject</option>
          <option value="body">Body</option>
          <option value="sender_name">Sender name</option>
        </select>
        <input class="nf-regex" dir="ltr" spellcheck="false" autocomplete="off"
               placeholder="regex, e.g. Invoice (\S+)"
               title="Python regular expression. The first ( ) group is used, or the whole match if there is no group.">
        <span class="nf-preview" dir="auto"></span>
      </div>
    </div>
  </template>

  <div id="toast-host"></div>
  <div id="win-resize-grip" title="Drag to resize"></div>

  <!-- Right-click menu for Receipts explorer rows (see rxContextMenu in app.js) -->
  <div id="rx-ctx-menu" role="menu" hidden>
    <button type="button" class="rx-ctx-item" data-act="ask-claude" role="menuitem">
      <svg viewBox="0 0 24 24" aria-hidden="true" width="13" height="13">
        <path fill="currentColor" d="M12 1.5l1.9 5.1 5.1 1.9-5.1 1.9L12 15.5l-1.9-5.1L5 8.5l5.1-1.9z
        M18.5 14l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z
        M5 15l.8 2 2 .8-2 .8L5 21.5l-.8-2-2-.8 2-.8z"/>
      </svg>
      <span>Ask Claude</span>
    </button>
  </div>

  <template id="tpl-card">
    <article class="card">
      <span class="pill"></span>
      <div class="card-main">
        <div class="card-title" dir="auto"></div>
        <div class="card-sub" dir="auto"></div>
      </div>
      <div class="card-meta">
        <span class="chip account"></span>
        <span class="date"></span>
        <a class="open-folder" href="#" title="Open folder">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
        </a>
      </div>
    </article>
  </template>

  <template id="tpl-fallback">
    <article class="card fb">
      <input type="checkbox" class="fb-check"
             title="Tick to include this email when you press &quot;Handle selected with Claude&quot;">
      <div class="card-main">
        <div class="fb-head">
          <div class="card-title" dir="auto"></div>
          <div class="card-sub" dir="auto"></div>
          <div class="fb-links">
            <a class="open-folder" href="#" title="Open folder">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
              </svg>
            </a>
            <a class="open-pdf" href="#">Open email.pdf</a>
            <span class="conf"></span>
          </div>
        </div>
        <form class="fb-form">
          <fieldset class="fb-kinds">
            <legend>What to do with this email</legend>
            <div class="opt">
              <label class="opt-head"><input type="radio" name="kind" value="file" checked> Change/add rule</label>
              <span class="opt-desc">File this email now <b>and</b> remember it: pick where it goes, then an existing rule (to extend it) or a new one, so future emails like it file automatically.</span>
              <div class="opt-body">
                <section class="step step-root">
                  <button type="button" class="step-head" title="Show or hide the roots">
                    <span class="step-num">1</span><span class="step-title">Root</span>
                    <span class="step-summary" dir="auto"></span>
                    <span class="step-toggle">change</span>
                  </button>
                  <div class="step-body">
                    <div class="cat-picker f-root-pick" data-value="">
                      <input class="cat-search" type="search" dir="auto" autocomplete="off" spellcheck="false"
                             placeholder="Search roots and rules&hellip;"
                             title="Filter by root name, folder, rule name, seller or sender">
                      <div class="cat-grid" role="listbox" aria-label="Roots"></div>
                      <div class="cat-grid-empty" hidden>No root matches &mdash; create a new one.</div>
                    </div>
                  </div>
                  <input class="f-root-name" type="text" dir="auto" hidden
                         placeholder="New root name (e.g. חשמל)"
                         title="Name of the new root — saved together with the rule when you Apply">
                </section>
                <section class="step step-rule">
                  <div class="step-head">
                    <span class="step-num">2</span><span class="step-title">Rule</span>
                    <span class="step-summary" dir="auto"></span>
                  </div>
                  <div class="step-body">
                    <div class="rule-pick" hidden>
                      <div class="rule-chips"></div>
                    </div>
                    <input class="f-rule-name" type="text" dir="auto" hidden
                           placeholder="New rule name (optional — defaults to the seller)">
                    <div class="opt-slot"></div>
                  </div>
                </section>
              </div>
            </div>
            <div class="opt">
              <label class="opt-head"><input type="radio" name="kind" value="exclude"> Exclude as promotional</label>
              <span class="opt-desc">This is not a receipt (newsletter / ad). Deletes the saved folder and auto-skips future emails matching the rule below.</span>
              <div class="opt-slot"></div>
            </div>
            <div class="opt">
              <label class="opt-head"><input type="radio" name="kind" value="once"> Move this one only</label>
              <span class="opt-desc">File just this one email using the settings below. Nothing is remembered &mdash; a similar email later will land in fallbacks again.</span>
              <div class="opt-slot"></div>
            </div>
            <div class="opt">
              <label class="opt-head"><input type="radio" name="kind" value="skip"> Skip</label>
              <span class="opt-desc">Remove it from this list without filing anything. The folder stays in <span dir="rtl">_לטיפול ידני</span>.</span>
              <div class="opt-slot"></div>
            </div>
          </fieldset>

          <div class="fb-fields">
            <div class="fb-fields-head" hidden></div>
            <div class="field fd-dest">
              <label>Destination</label>
              <div class="combo f-dest" data-value="">
                <input class="combo-input" type="text" dir="auto" autocomplete="off" spellcheck="false"
                       placeholder="Pick a folder or type to search&hellip;"
                       title="The folder this receipt is filed into. Most-used folders first; Browse… opens the Windows folder picker (it can also create a new folder).">
                <ul class="combo-list" hidden></ul>
              </div>
              <span class="hint">The folder the receipt is filed into.</span>
            </div>
            <div class="field fd-seller">
              <label>Seller</label>
              <div class="nf-slot"></div>
              <span class="hint">Business name shown in the folder name.</span>
            </div>
            <div class="field fd-product">
              <label>Product</label>
              <div class="nf-slot"></div>
              <span class="hint">What the receipt is for.</span>
            </div>
            <div class="field fd-match">
              <label>Match rule</label>
              <div class="fb-match-existing" hidden></div>
              <div class="mr-slot"></div>
              <span class="hint">Future emails matching <b>all</b> of these conditions follow this choice. Click a suggested keyword to add it; ≠ flips it to “must NOT contain”.</span>
            </div>
          </div>
          <button type="submit" class="fb-apply">Apply</button>
        </form>
      </div>
    </article>
  </template>

  <template id="tpl-fb-compact">
    <article class="card fb-compact">
      <input type="checkbox" class="fb-check" title="Select for &quot;Handle selected with Claude&quot;">
      <div class="card-main">
        <div class="card-title" dir="auto"></div>
        <div class="card-sub" dir="auto"></div>
      </div>
      <span class="conf"></span>
      <a class="open-folder" href="#" title="Open folder">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
        </svg>
      </a>
      <button class="fb-expand" title="Show options">&#9656;</button>
      <div class="fb-form-slot" hidden></div>
    </article>
  </template>

  <template id="tpl-rx-root">
    <div class="rx-root-wrap">
      <button class="rx-root"><span class="rx-root-label" dir="auto"></span></button>
      <button class="rx-root-toggle" tabindex="-1"></button>
    </div>
  </template>

  <template id="tpl-rx-row">
    <div class="rx-row" tabindex="0">
      <span class="rx-glyph"></span>
      <span class="rx-name" dir="auto"></span>
      <span class="rx-meta"></span>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
